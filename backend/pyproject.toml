[project]
name = "nexttrack"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vineet Erasala", email = "erasalav@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.8",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.11.0",
    "redis>=5.0",
    "sse-starlette>=2.0",
    "uvicorn[standard]>=0.39.0",
]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.0",
    "fakeredis>=2.20",
    "httpx>=0.28.1",
    "hypothesis>=6.100",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "python-dotenv>=1.2.1",
    "respx>=0.23.1",
    "ruff>=0.15.18",
]
